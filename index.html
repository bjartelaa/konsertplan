<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konsertplan</title>
<meta name="description" content="Lønnsomhet og finansieringsbehov per konsert for en konsertsesong. Bygget for Sceneskift våren 2027.">
<link rel="stylesheet" href="css/konsertplan.css">
</head>
<body>
<div class="topp-band">
  <img class="topp-bilde" src="img/publikum.jpg" alt="">
  <header class="topp">
    <div class="topp-venstre">
      <h1 class="gaffa"><span>Konsertplan</span></h1>
      <div class="sesongnavn">
        <input id="sesongnavn" type="text" aria-label="Navn på sesongen" spellcheck="false">
        <p class="undertekst" id="undertekst"></p>
      </div>
    </div>
    <div class="topp-hoyre">
      <a class="tilbake" id="til-presentasjon" href="../sceneskift-kart/site/index.html#6" hidden>Tilbake til presentasjonen</a>
      <button type="button" id="knapp-forklar" class="bryter" aria-pressed="false">Forklaringer</button>
      <button type="button" id="knapp-aapne">Åpne</button>
      <input type="file" id="fil" accept="application/json,.json" hidden>
      <button type="button" id="knapp-lagre">Lagre</button>
      <button type="button" id="knapp-nullstill" class="stille">Nullstill til 2027</button>
    </div>
  </header>
  <nav class="faner" aria-label="Deler av verktøyet">
    <button type="button" data-fane="raadet" aria-pressed="true">Rådet</button>
    <button type="button" data-fane="program">Program</button>
    <button type="button" data-fane="resultater">Resultater</button>
    <button type="button" data-fane="saler">Saler</button>
    <button type="button" data-fane="forutsetninger">Forutsetninger</button>
  </nav>
</div>

<section class="stripe" id="stripe" aria-label="Resultatene akkurat nå"></section>

<main id="innhold"></main>

<footer class="bunn">
  <p>Konsertplan er laget til MET3 Arbeidskrav 2 ved NHH (Bjarte Laa, Petter Garli og Maxime Boudailliez). Sceneskift, salene og tallene er fiktive og laget for undervisning. Alt regnes i nettleseren og lagres bare på denne maskinen.</p>
</footer>

<script src="konsertplan.js"></script>
</body>
</html>
